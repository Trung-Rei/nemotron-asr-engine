# Reproduce the benchmarks on a rented GPU with vkong (https://vkong.tli-tech.com):
#   vkong run --detach            # rents the GPU after you approve the price, runs bench/run_all.sh
#   vkong attach <vk_...>         # follow the log
#   vkong storage download nemotron-asr-engine-results results -o ./results
#   vkong app stop nemotron-asr-engine-bench
# Any other GPU machine works too: pip install -r research/requirements.txt && bash bench/run_all.sh

# App
type: task
app: nemotron-asr-engine-bench

# Compute
gpu: A100            # the 40 GB card; the results in docs/benchmarks.md were measured on it
num_gpus: 1
disk_gb: 80          # torch + NeMo ~15 GB, model files ~5 GB, dataset audio, caches

# Budget
max_price: 0.45      # USD per hour (verified A100 hosts started from $0.42 on 2026-11-12)
verified_only: true  # an unverified host failed to start once; verified ones start reliably

# Storage: results survive the machine
storage:
  volume: nemotron-asr-engine-results

# Runtime
image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
init_cmd: apt-get update && apt-get install -y --no-install-recommends build-essential ffmpeg libsndfile1 git && pip install -r research/requirements.txt
start: RESULTS_DIR=/vkong/storage/nemotron-asr-engine-results bash bench/run_all.sh
