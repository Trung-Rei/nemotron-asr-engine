name: ci
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ruff pytest numpy
      - run: ruff check .
      - run: pytest -q          # CPU tests: audio decoding, upsampler, chunk windows (no torch, no GPU)
      - run: pip install --no-deps -e . && nemotron-engine --help
