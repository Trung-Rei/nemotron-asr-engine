[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nemotron-asr-engine"
version = "0.1.0"
description = "Real-time multi-stream streaming ASR engine for NVIDIA Nemotron ASR streaming (0.6B), in plain PyTorch: one CUDA graph per step, hundreds of concurrent streams per GPU."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
keywords = ["asr", "speech-recognition", "streaming", "nemotron", "rnnt", "cuda-graphs", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "numpy",
    "safetensors>=0.4",
    "tokenizers>=0.19",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# benchmarks, the reference port (research/nemotron_lite) and the WebSocket load tests
bench = ["soundfile>=0.12.1", "scipy", "datasets>=3.2.0", "jiwer>=3.0.0", "websockets>=12", "brotli>=1.2"]
dev = ["ruff", "pytest"]

[project.scripts]
nemotron-asr-engine = "nemotron_engine.cli:main"

[project.urls]
Homepage = "https://github.com/Trung-Rei/nemotron-asr-engine"
Model = "https://huggingface.co/nvidia/nemotron-3.5-asr-streaming-0.6b"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nemotron_engine = ["static/*"]

[tool.ruff]
line-length = 120
extend-exclude = ["bench/rtfx/nemo_examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*_cpu.py"]

[tool.ruff.lint.per-file-ignores]
"tests/check_fused_attn.py" = ["E702"]
